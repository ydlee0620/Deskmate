<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>桌面小夥伴</title>
<style>
  :root{
    --bg:#0b0c10;
    --panel:#15171c;
    --panel-2:#1c1f26;
    --amber:#ffb454;
    --amber-dim:#8a5a25;
    --amber-glow:#ffd48a;
    --text:#e8e6df;
    --text-dim:#8b8d95;
    --danger:#e8604c;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:radial-gradient(120% 120% at 50% -10%, #1a1d24 0%, var(--bg) 55%);
    color:var(--text);
    font-family: -apple-system, "SF Pro Text", "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
    overflow-x:hidden;
  }
  .app{
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 20px calc(28px + env(safe-area-inset-bottom));
  }
  .stage{
    width:100%;
    max-width:420px;
    aspect-ratio:1/1;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top:6px;
  }
  canvas#eyes{ width:100%; height:100%; display:block; touch-action:none; }

  .status{
    margin-top:2px;
    font-size:13px;
    letter-spacing:.08em;
    color:var(--text-dim);
    text-transform:uppercase;
    height:18px;
  }
  .status.live{ color:var(--amber); }

  .panel{
    width:100%;
    max-width:420px;
    margin-top:22px;
    background:var(--panel);
    border:1px solid #24262e;
    border-radius:18px;
    padding:16px;
  }
  .row{ display:flex; gap:10px; margin-bottom:10px; }
  .row:last-child{ margin-bottom:0; }
  .field{ flex:1; display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:11px; color:var(--text-dim); letter-spacing:.05em; }
  .field input, .field textarea{
    background:var(--panel-2);
    border:1px solid #2a2d36;
    border-radius:10px;
    color:var(--text);
    padding:10px 12px;
    font-size:14px;
    font-family:inherit;
    outline:none;
  }
  .field input:focus, .field textarea:focus{ border-color:var(--amber-dim); }
  .field textarea{ resize:none; height:56px; }

  details{ margin-top:2px; }
  summary{
    cursor:pointer; color:var(--text-dim); font-size:12.5px;
    list-style:none; display:flex; align-items:center; gap:6px;
    padding:6px 0;
  }
  summary::-webkit-details-marker{ display:none; }
  summary::before{ content:"▸"; font-size:10px; transition:transform .15s; }
  details[open] summary::before{ transform:rotate(90deg); }

  .btn{
    width:100%;
    margin-top:14px;
    padding:15px;
    border:none;
    border-radius:14px;
    font-size:15px;
    font-weight:600;
    letter-spacing:.03em;
    cursor:pointer;
    background:linear-gradient(180deg, #ffc06a, #e89a3c);
    color:#241505;
    transition:transform .08s ease, filter .15s ease;
  }
  .btn:active{ transform:scale(.98); }
  .btn.stop{ background:linear-gradient(180deg, #f0796a, var(--danger)); color:#2b0a05; }
  .btn:disabled{ filter:grayscale(.5) brightness(.6); cursor:default; }

  .hint{ font-size:11.5px; color:var(--text-dim); margin-top:10px; line-height:1.5; text-align:center; }
  .hint b{ color:var(--amber); font-weight:600; }
</style>
</head>
<body>
<div class="app">
  <div class="stage"><canvas id="eyes"></canvas></div>
  <div class="status" id="status">尚未連線</div>

  <div class="panel">
    <div class="row">
      <div class="field" style="flex:1">
        <label>Gemini API 金鑰</label>
        <input id="apiKey" type="password" placeholder="AIza..." autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
    </div>

    <details>
      <summary>進階設定（模型 / 個性）</summary>
      <div class="row" style="margin-top:8px">
        <div class="field">
          <label>模型名稱</label>
          <input id="modelName" type="text" value="gemini-3.1-flash-live-preview" spellcheck="false">
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label>個性設定（system instruction）</label>
          <textarea id="persona">你是使用者桌上的AI小夥伴,個性溫暖、活潑、簡短風趣。用繁體中文口語化回答,盡量簡潔,不要長篇大論。</textarea>
        </div>
      </div>
    </details>

    <button class="btn" id="toggleBtn">開始對話</button>
    <div class="hint">需要用瀏覽器開啟並允許<b>麥克風權限</b>；金鑰只存在本次瀏覽器記憶體中，關閉頁面即清除。</div>
  </div>
</div>

<script>
(() => {
  // ---------- Canvas eyes ----------
  const canvas = document.getElementById('eyes');
  const ctx = canvas.getContext('2d');
  let dpr = Math.min(window.devicePixelRatio || 1, 2.5);

  function resize(){
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  // State: idle | listening | speaking
  let state = 'idle';
  let blink = 0;           // 0..1, 1 = fully closed
  let nextBlinkAt = performance.now() + 2000 + Math.random()*2500;
  let breathing = 0;
  let level = 0;           // smoothed audio energy for speaking pulse
  let targetLevel = 0;
  let gazeX = 0, gazeY = 0, gazeTX = 0, gazeTY = 0;
  let nextGazeAt = performance.now() + 2500;

  function setState(s){ state = s; }

  function loop(t){
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0,0,w,h);

    // background subtle vignette panel behind eyes (like a phone screen)
    const cx = w/2, cy = h/2;
    const panelW = w*0.86, panelH = h*0.62;
    ctx.save();
    const rr = Math.min(panelW,panelH)*0.14;
    roundRect(ctx, cx-panelW/2, cy-panelH/2, panelW, panelH, rr);
    ctx.fillStyle = '#000000';
    ctx.fill();
    ctx.restore();

    breathing += 0.02;
    const breathe = Math.sin(breathing) * 0.02;

    // blink timing
    if (t > nextBlinkAt && state !== 'speaking'){
      blink = Math.min(1, blink + 0.35);
      if (blink >= 1) nextBlinkAt = t + 60; // hold closed briefly then handled below
    } else {
      blink = Math.max(0, blink - 0.22);
    }
    if (blink <= 0.02 && t > nextBlinkAt + 200){
      nextBlinkAt = t + 2200 + Math.random()*3200;
    }

    // gaze drift (idle only)
    if (t > nextGazeAt && state === 'idle'){
      gazeTX = (Math.random()-0.5) * 0.35;
      gazeTY = (Math.random()-0.5) * 0.2;
      nextGazeAt = t + 2500 + Math.random()*3000;
    }
    if (state === 'listening'){ gazeTX = 0; gazeTY = -0.08; }
    if (state === 'speaking'){ gazeTX = 0; gazeTY = 0.02; }
    gazeX += (gazeTX-gazeX)*0.04;
    gazeY += (gazeTY-gazeY)*0.04;

    // smoothed audio level
    level += (targetLevel - level) * 0.25;

    const eyeGapRatio = 0.30;
    const baseEyeW = panelW * 0.30;
    const baseEyeH = panelH * (0.62 + breathe);
    const glowPulse = state === 'speaking' ? (0.4 + level*1.4) : (state==='listening' ? 0.75 : 0.45);
    const scaleUp = state === 'listening' ? 1.05 : (state === 'speaking' ? 1.0 + level*0.10 : 1.0);

    const eyeW = baseEyeW * scaleUp;
    const eyeH = baseEyeH * (1 - blink*0.92) * scaleUp;
    const eyeR = Math.min(eyeW,eyeH) * 0.42;

    const totalW = eyeW*2 + panelW*eyeGapRatio;
    const startX = cx - totalW/2;
    const eyeY = cy + gazeY*panelH*0.12;

    const positions = [
      startX + eyeW/2 + gazeX*panelW*0.05,
      startX + eyeW*1.5 + panelW*eyeGapRatio + gazeX*panelW*0.05
    ];

    for (const ex of positions){
      ctx.save();
      ctx.shadowColor = 'rgba(255,180,84,'+(0.55+glowPulse*0.4)+')';
      ctx.shadowBlur = 40 * dpr * (0.6+glowPulse*0.8);
      roundRect(ctx, ex-eyeW/2, eyeY-eyeH/2, eyeW, eyeH, eyeR);
      const grad = ctx.createLinearGradient(ex, eyeY-eyeH/2, ex, eyeY+eyeH/2);
      grad.addColorStop(0, '#ffe3ad');
      grad.addColorStop(0.5, '#ffb454');
      grad.addColorStop(1, '#c97a20');
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.restore();
    }

    requestAnimationFrame(loop);
  }
  function roundRect(ctx,x,y,w,h,r){
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }
  requestAnimationFrame(loop);

  // ---------- Status UI ----------
  const statusEl = document.getElementById('status');
  const toggleBtn = document.getElementById('toggleBtn');
  function setStatus(text, live){
    statusEl.textContent = text;
    statusEl.className = 'status' + (live ? ' live' : '');
  }

  // ---------- Audio + Gemini Live plumbing ----------
  let ws = null;
  let micStream = null;
  let captureCtx = null;
  let processorNode = null;
  let sourceNode = null;
  let playCtx = null;
  let playCursor = 0;
  let running = false;

  const TARGET_IN_RATE = 16000;

  function base64ToArrayBuffer(b64){
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return bytes.buffer;
  }
  function arrayBufferToBase64(buf){
    let binary = '';
    const bytes = new Uint8Array(buf);
    const chunk = 0x8000;
    for (let i=0;i<bytes.length;i+=chunk){
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
    }
    return btoa(binary);
  }

  // Downsample Float32 mono buffer from inRate to 16000, return Int16Array PCM
  function downsampleTo16k(float32, inRate){
    if (inRate === TARGET_IN_RATE){
      return floatToInt16(float32);
    }
    const ratio = inRate / TARGET_IN_RATE;
    const newLen = Math.round(float32.length / ratio);
    const result = new Float32Array(newLen);
    for (let i=0;i<newLen;i++){
      const idx = i*ratio;
      const i0 = Math.floor(idx);
      const i1 = Math.min(i0+1, float32.length-1);
      const frac = idx - i0;
      result[i] = float32[i0]*(1-frac) + float32[i1]*frac;
    }
    return floatToInt16(result);
  }
  function floatToInt16(float32){
    const out = new Int16Array(float32.length);
    for (let i=0;i<float32.length;i++){
      let s = Math.max(-1, Math.min(1, float32[i]));
      out[i] = s < 0 ? s*0x8000 : s*0x7fff;
    }
    return out;
  }

  async function startSession(){
    const apiKey = document.getElementById('apiKey').value.trim();
    if (!apiKey){ alert('請先輸入 Gemini API 金鑰'); return; }
    const model = document.getElementById('modelName').value.trim() || 'gemini-3.1-flash-live-preview';
    const persona = document.getElementById('persona').value.trim();

    setStatus('連線中…', false);
    toggleBtn.disabled = true;

    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: {
        channelCount:1, echoCancellation:true, noiseSuppression:true, autoGainControl:true
      }});
    } catch (e){
      setStatus('麥克風權限被拒絕', false);
      toggleBtn.disabled = false;
      return;
    }

    const wsUrl = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${apiKey}`;
    ws = new WebSocket(wsUrl);

    ws.onopen = () => {
      ws.send(JSON.stringify({
        setup: {
          model: `models/${model}`,
          generationConfig: { responseModalities: ['AUDIO'] },
          systemInstruction: { parts: [{ text: persona }] }
        }
      }));
    };

    ws.onmessage = async (event) => {
      let text = event.data;
      if (event.data instanceof Blob){ text = await event.data.text(); }
      let msg;
      try { msg = JSON.parse(text); } catch(e){ return; }

      if (msg.setupComplete){
        running = true;
        setStatus('聆聽中', true);
        setState('listening');
        toggleBtn.disabled = false;
        toggleBtn.textContent = '結束對話';
        toggleBtn.classList.add('stop');
        beginCapture();
        return;
      }

      if (msg.serverContent){
        const sc = msg.serverContent;
        if (sc.interrupted){
          setState('listening');
          setStatus('聆聽中', true);
        }
        if (sc.modelTurn && sc.modelTurn.parts){
          for (const part of sc.modelTurn.parts){
            if (part.inlineData && part.inlineData.data){
              setState('speaking');
              setStatus('說話中', true);
              playPCMChunk(part.inlineData.data);
            }
          }
        }
        if (sc.turnComplete){
          setState('listening');
          setStatus('聆聽中', true);
          targetLevel = 0;
        }
      }
    };

    ws.onerror = () => { setStatus('連線發生錯誤', false); };
    ws.onclose = () => {
      running = false;
      setState('idle');
      setStatus('已結束', false);
      toggleBtn.textContent = '開始對話';
      toggleBtn.classList.remove('stop');
      toggleBtn.disabled = false;
      teardownCapture();
    };
  }

  function beginCapture(){
    captureCtx = new (window.AudioContext || window.webkitAudioContext)();
    sourceNode = captureCtx.createMediaStreamSource(micStream);
    processorNode = captureCtx.createScriptProcessor(4096, 1, 1);
    sourceNode.connect(processorNode);
    processorNode.connect(captureCtx.destination === null ? undefined : captureCtx.destination);
    // Note: connecting to destination is required in some browsers to keep the node alive;
    // we mute it via gain 0 to avoid feedback.
    const muteGain = captureCtx.createGain();
    muteGain.gain.value = 0;
    processorNode.disconnect();
    processorNode.connect(muteGain);
    muteGain.connect(captureCtx.destination);

    processorNode.onaudioprocess = (e) => {
      if (!running || !ws || ws.readyState !== WebSocket.OPEN) return;
      const input = e.inputBuffer.getChannelData(0);
      const pcm16 = downsampleTo16k(input, captureCtx.sampleRate);
      const b64 = arrayBufferToBase64(pcm16.buffer);
      ws.send(JSON.stringify({
        realtimeInput: {
          audio: { data: b64, mimeType: 'audio/pcm;rate=16000' }
        }
      }));
    };
  }

  function teardownCapture(){
    if (processorNode){ try{ processorNode.disconnect(); }catch(e){} processorNode = null; }
    if (sourceNode){ try{ sourceNode.disconnect(); }catch(e){} sourceNode = null; }
    if (captureCtx){ captureCtx.close().catch(()=>{}); captureCtx = null; }
    if (micStream){ micStream.getTracks().forEach(t=>t.stop()); micStream = null; }
  }

  function playPCMChunk(base64Data){
    if (!playCtx){
      playCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
      playCursor = playCtx.currentTime + 0.05;
    }
    const buf = base64ToArrayBuffer(base64Data);
    const int16 = new Int16Array(buf);
    const float32 = new Float32Array(int16.length);
    let sumSq = 0;
    for (let i=0;i<int16.length;i++){
      const v = int16[i] / 32768;
      float32[i] = v;
      sumSq += v*v;
    }
    const rms = Math.sqrt(sumSq / Math.max(1,int16.length));
    targetLevel = Math.min(1, rms * 6);

    const audioBuffer = playCtx.createBuffer(1, float32.length, 24000);
    audioBuffer.copyToChannel(float32, 0);
    const src = playCtx.createBufferSource();
    src.buffer = audioBuffer;
    src.connect(playCtx.destination);
    const now = playCtx.currentTime;
    if (playCursor < now) playCursor = now + 0.02;
    src.start(playCursor);
    playCursor += audioBuffer.duration;
  }

  function stopSession(){
    running = false;
    if (ws){ try{ ws.close(); }catch(e){} ws = null; }
    teardownCapture();
    setState('idle');
    setStatus('已結束', false);
    toggleBtn.textContent = '開始對話';
    toggleBtn.classList.remove('stop');
  }

  toggleBtn.addEventListener('click', () => {
    if (running || toggleBtn.classList.contains('stop')){
      stopSession();
    } else {
      startSession();
    }
  });
})();
</script>
</body>
</html>
